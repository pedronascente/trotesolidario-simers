services:
  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - trote-network  

  php:
    build: ./docker/php
    env_file:
      - ./.env
    volumes:
      - ./src:/var/www/html
    networks:
      - trote-network   

  mysql-db:
    image: mysql:5.7
   
    restart: always
    environment:
     MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
     MYSQL_DATABASE: ${DB_DATABASE}
     MYSQL_USER: ${DB_USERNAME}
     MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      # - ./docker/mysql/muhm.sql:/docker-entrypoint-initdb.d/muhm.sql
    ports:
      # - "3308:3306"
       - "3309:3306"
    networks:
      - trote-network   

volumes:
  mysql-data:



networks:
  trote-network:
    driver: bridge
